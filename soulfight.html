<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>無限魂斗羅：終極完美版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0d11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        h1 {
            margin: 2px 0;
            font-size: 1.1rem;
            color: #ff4444;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
        }

        #scoreboard {
            font-size: 0.85rem;
            margin-bottom: 3px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: center;
        }

        canvas {
            border: 2px solid #ff4444;
            background-color: #121222;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
            width: 100%;
            max-width: 750px;
            height: auto;
            aspect-ratio: 750 / 380;
            display: block;
        }

        /* 彈窗樣式 */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 10px;
        }

        .modal h2 {
            color: #FFD700;
            margin-bottom: 12px;
            font-size: 1.2rem;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .skill-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .skill-card {
            background: #1e1e2d;
            border: 2px solid #FFD700;
            padding: 10px;
            width: 30%;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .skill-card:active, .skill-card:hover {
            background: #33334d;
            transform: scale(1.03);
        }

        .skill-card h3 {
            margin: 0 0 5px 0;
            color: #FFEB3B;
            font-size: 0.85rem;
        }

        .skill-card p {
            margin: 0;
            font-size: 0.7rem;
            color: #ccc;
        }

        /* 商店樣式 */
        .shop-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 80%;
            max-width: 320px;
            margin-bottom: 12px;
        }

        .shop-btn {
            background: #2a2a3d;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .shop-btn:active {
            background: #444466;
        }

        /* 手機虛擬控制器 */
        .controls {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 750px;
            padding: 0 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(2, 40px);
            gap: 4px;
        }

        .action-pad {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            font-size: 1rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            backdrop-filter: blur(4px);
        }

        .btn:active {
            background-color: rgba(255, 68, 68, 0.6);
            border-color: #ff8888;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .btn-action {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-jump { background-color: rgba(42, 75, 124, 0.6); }
        .btn-fire { background-color: rgba(124, 42, 42, 0.8); width: 58px; height: 58px; }
        .btn-invinc { background-color: rgba(74, 20, 140, 0.6); }

        .key-hints {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 { font-size: 0.95rem; }
            #scoreboard { font-size: 0.75rem; gap: 6px; }
            .btn-action { width: 46px; height: 46px; font-size: 0.75rem; }
            .btn-fire { width: 52px; height: 52px; }
            .dpad { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 36px); }
            .key-hints { display: none; }
        }
    </style>
</head>
<body>

    <!-- 圖片預載入 -->
    <img id="runSprite" src="player_run.png" style="display:none;" alt="run">
    <img id="shootSprite" src="player_shoot.png" style="display:none;" alt="shoot">
    <img id="shootBulletImg" src="SHOOT1.PNG" style="display:none;" alt="bullet">

    <img id="monster1" src="MONSTER1.PNG" style="display:none;" alt="m1">
    <img id="monster2" src="MONSTER2.PNG" style="display:none;" alt="m2">
    <img id="monster3" src="MONSTER3.PNG" style="display:none;" alt="m3">
    <img id="monster4" src="MONSTER4.PNG" style="display:none;" alt="m4">
    <img id="monster5" src="MONSTER5.PNG" style="display:none;" alt="m5">
    <img id="monster6" src="MONSTER6.PNG" style="display:none;" alt="m6">
    <img id="monster7" src="MONSTER7.PNG" style="display:none;" alt="m7">
    <img id="monster8" src="MONSTER8.PNG" style="display:none;" alt="m8">
    <img id="monster9" src="MONSTER9.PNG" style="display:none;" alt="m9">
    <img id="monster10" src="MONSTER10.PNG" style="display:none;" alt="m10">

    <img id="boss1" src="BOSS1.png" style="display:none;" alt="b1">
    <img id="boss2" src="BOSS2.png" style="display:none;" alt="b2">
    <img id="boss3" src="BOSS3.png" style="display:none;" alt="b3">
    <img id="boss4" src="BOSS4.png" style="display:none;" alt="b4">
    <img id="boss5" src="BOSS5.png" style="display:none;" alt="b5">
    <img id="boss6" src="BOSS6.png" style="display:none;" alt="b6">
    <img id="boss7" src="BOSS7.png" style="display:none;" alt="b7">
    <img id="boss8" src="BOSS8.png" style="display:none;" alt="b8">
    <img id="boss9" src="BOSS9.png" style="display:none;" alt="b9">
    <img id="boss10" src="BOSS10.png" style="display:none;" alt="b10">

    <h1>👻 魂斗羅：終極完美版</h1>
    
    <div id="scoreboard">
        <div>分數: <span id="score">0</span></div>
        <div>生命: <span id="lives">10</span></div>
        <div>護盾: <span id="shield" style="color: #00E5FF;">0/3</span></div>
        <div>關卡: <span id="wave" style="color: #4CAF50;">第 1 波</span></div>
        <div>碎片: <span id="souls" style="color: #E040FB;">0</span></div>
        <div>無敵CD: <span id="invincibleCd" style="color: #00E5FF;">就緒</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="750" height="380"></canvas>
        
        <!-- 三選一技能彈窗 -->
        <div id="skillModal" class="modal">
            <h2 id="modalTitle">🎁 補給箱！選擇技能 (按 1, 2, 3)</h2>
            <div class="skill-options" id="skillOptionsContainer"></div>
        </div>

        <!-- 局外天賦商店彈窗 -->
        <div id="shopModal" class="modal" style="display: none;">
            <h2>🏛️ 魂之祭壇 (天賦商店)</h2>
            <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">累積靈魂碎片提升初始戰力：</p>
            <div class="shop-items">
                <div class="shop-btn" onclick="buyTalent('hp')">
                    <span>❤️ 初始生命 +1 (目前:<span id="talHp">0</span>)</span>
                    <span id="costHp" style="color:#FFD700;">100 碎片</span>
                </div>
                <div class="shop-btn" onclick="buyTalent('shield')">
                    <span>🛡️ 開局護盾 +1 (目前:<span id="talShield">0</span>)</span>
                    <span id="costShield" style="color:#FFD700;">150 碎片</span>
                </div>
                <div class="shop-btn" onclick="buyTalent('dmg')">
                    <span>⚔️ 基礎傷害提升 (目前:<span id="talDmg">0</span>)</span>
                    <span id="costDmg" style="color:#FFD700;">200 碎片</span>
                </div>
            </div>
            <button class="btn" style="padding: 6px 20px; background: #ff4444;" onclick="restartGame()">🚀 再次挑戰</button>
        </div>
    </div>

    <!-- 虛擬控制器 -->
    <div class="controls">
        <div class="dpad">
            <button class="btn btn-up" id="btnUp">⬆️</button>
            <button class="btn btn-left" id="btnLeft">⬅️</button>
            <button class="btn btn-right" id="btnRight">➡️</button>
        </div>
        <div class="action-pad">
            <button class="btn btn-action btn-invinc" id="btnInvinc">🛡️無敵</button>
            <button class="btn btn-action btn-jump" id="btnJump">跳躍</button>
            <button class="btn btn-action btn-fire" id="btnFire">🔥開火</button>
        </div>
    </div>

    <div class="key-hints">
        💡 <b>電腦鍵盤：</b> 方向鍵/WASD 移動瞄準 | Z 發射 | X/Space 跳躍 | C 無敵技能 | 數字鍵 1/2/3 選技能
    </div>

    <script>
        // === Web Audio API 音效合成引擎 ===
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;

                if (type === 'shoot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'laser') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'explode') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'powerup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e){}
        }

        // === 畫布與 DOM 初始化 ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const shieldElement = document.getElementById('shield');
        const waveElement = document.getElementById('wave');
        const soulsElement = document.getElementById('souls');
        const invincibleCdElement = document.getElementById('invincibleCd');
        const skillModal = document.getElementById('skillModal');
        const shopModal = document.getElementById('shopModal');
        const modalTitle = document.getElementById('modalTitle');
        const skillOptionsContainer = document.getElementById('skillOptionsContainer');

        const runSpriteImg = document.getElementById('runSprite');
        const shootSpriteImg = document.getElementById('shootSprite');

        const monsterImages = [];
        for (let i = 1; i <= 10; i++) monsterImages.push(document.getElementById(`monster${i}`));
        const bossImages = [];
        for (let i = 1; i <= 10; i++) bossImages.push(document.getElementById(`boss${i}`));

        // === 局外天賦存檔與載入 ===
        let souls = parseInt(localStorage.getItem('contra_souls') || '0');
        let talents = JSON.parse(localStorage.getItem('contra_talents') || '{"hp":0, "shield":0, "dmg":0}');

        function saveGameData() {
            localStorage.setItem('contra_souls', souls);
            localStorage.setItem('contra_talents', JSON.stringify(talents));
            soulsElement.textContent = souls;
        }

        // === 遊戲核心變數 ===
        let score = 0;
        let lives = 10;
        let shieldCharges = 0;
        let wave = 1;
        let isGameOver = false;
        let isPausedForSkill = false;
        let isGameStarted = false; 
        let countdownTimer = 0; 
        let currentSkillChoices = [];
        let initialPick = true;

        let groundY = 310;
        let particles = []; // 擊中粒子效果
        let platforms = [   // 懸浮跳躍平台
            { x: 180, y: 220, w: 110, h: 12 },
            { x: 460, y: 190, w: 120, h: 12 }
        ];

        let bgScrollX = 0;
        let clouds = [
            { x: 50, y: 40, speed: 0.2, size: 50 },
            { x: 380, y: 70, speed: 0.15, size: 70 },
            { x: 620, y: 30, speed: 0.25, size: 60 }
        ];

        let invincibleTimer = 0;
        let invincibleCdTimer = 0;
        const invincibleDuration = 180;
        const invincibleCdMax = 900; // 15秒

        let player = {
            x: 50,
            y: 240,
            width: 48,
            height: 48,
            vx: 0,
            vy: 0,
            speed: 4.2,
            jumpPower: -11.5,
            isJumping: false,
            canDoubleJump: false,
            isShooting: false,
            shootAnimTimer: 0,
            facing: 1,
            weapons: { normal: 1, scatter: 0, laser: 0, heal: 0 },
            shootCooldown: 0,
            animTimer: 0,
            runFrame: 0,
            shootFrame: 0
        };

        let gravity = 0.58;
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let powerUp = null;
        let boss = null;
        let keys = {};

        // === 事件與按鍵監聽 ===
        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.repeat) return;
            keys[e.code] = true;

            if (isPausedForSkill) {
                if (e.code === 'Digit1' || e.code === 'Numpad1') selectSkillByIndex(0);
                if (e.code === 'Digit2' || e.code === 'Numpad2') selectSkillByIndex(1);
                if (e.code === 'Digit3' || e.code === 'Numpad3') selectSkillByIndex(2);
                e.preventDefault();
                return;
            }

            if (!isGameStarted) return;

            if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX') {
                triggerJump();
                e.preventDefault();
            }
            if (e.code === 'KeyZ') {
                fireBullet();
                e.preventDefault();
            }
            if (e.code === 'KeyC') {
                triggerInvincible();
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function bindButton(id, actionDown, actionUp) {
            const el = document.getElementById(id);
            if (!el) return;
            const startHandler = (e) => {
                e.preventDefault();
                initAudio();
                actionDown();
            };
            const endHandler = (e) => {
                e.preventDefault();
                if (actionUp) actionUp();
            };

            el.addEventListener('touchstart', startHandler);
            el.addEventListener('touchend', endHandler);
            el.addEventListener('mousedown', startHandler);
            if (actionUp) el.addEventListener('mouseup', endHandler);
        }

        bindButton('btnUp', () => keys['ArrowUp'] = true, () => keys['ArrowUp'] = false);
        bindButton('btnLeft', () => keys['ArrowLeft'] = true, () => keys['ArrowLeft'] = false);
        bindButton('btnRight', () => keys['ArrowRight'] = true, () => keys['ArrowRight'] = false);
        bindButton('btnJump', () => triggerJump());
        bindButton('btnFire', () => fireBullet());
        bindButton('btnInvinc', () => triggerInvincible());

        function triggerJump() {
            if (isGameOver || isPausedForSkill || !isGameStarted) return;
            if (!player.isJumping) {
                player.vy = player.jumpPower;
                player.isJumping = true;
                player.canDoubleJump = true;
            } else if (player.canDoubleJump) {
                player.vy = player.jumpPower * 0.9;
                player.canDoubleJump = false;
            }
        }

        function triggerInvincible() {
            if (isGameOver || isPausedForSkill || !isGameStarted) return;
            if (invincibleCdTimer <= 0) {
                invincibleTimer = invincibleDuration;
                invincibleCdTimer = invincibleCdMax;
                playSound('powerup');
            }
        }

        // === 動態打擊粒子系統 ===
        function addParticles(x, y, color, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 15,
                    color: color
                });
            }
        }

        // === 發射子彈 (動態冷卻與武器屬性) ===
        function fireBullet() {
            if (isGameOver || isPausedForSkill || !isGameStarted) return;
            if (player.shootCooldown > 0) return;

            // 動態武器發射速率控制
            if (player.weapons.laser > 0) {
                player.shootCooldown = 5;
                playSound('laser');
            } else if (player.weapons.scatter > 0) {
                player.shootCooldown = 11;
                playSound('shoot');
            } else {
                player.shootCooldown = 7;
                playSound('shoot');
            }

            player.isShooting = true;
            player.shootFrame = 0;
            player.shootAnimTimer = 0;

            let aimX = player.facing;
            let aimY = 0;
            if (keys['ArrowUp'] || keys['KeyW']) {
                aimY = -1;
                aimX = 0;
            }

            let baseDmg = 1 + (talents.dmg * 0.5);

            // 普通子彈
            if (player.weapons.normal > 0) {
                let count = player.weapons.normal;
                for (let i = 0; i < count; i++) {
                    bullets.push({
                        x: aimY < 0 ? player.x + player.width / 2 - 3 + (i * 6) : (player.facing > 0 ? player.x + player.width : player.x - 12),
                        y: (aimY < 0 ? player.y - 10 : player.y + 18) + (i * 4),
                        vx: aimX * 10,
                        vy: aimY * 10,
                        width: 10,
                        height: 7,
                        type: 'normal',
                        dmg: baseDmg
                    });
                }
            }

            // 散彈
            if (player.weapons.scatter > 0) {
                let totalBullets = player.weapons.scatter + 1;
                let spreadStep = 0.45;
                for (let i = 0; i < totalBullets; i++) {
                    let spreadFactor = (i - (totalBullets - 1) / 2) * spreadStep;
                    bullets.push({
                        x: player.facing > 0 ? player.x + player.width : player.x - 12,
                        y: player.y + 18,
                        vx: player.facing * 9,
                        vy: spreadFactor * 4,
                        width: 10,
                        height: 8,
                        type: 'scatter',
                        dmg: baseDmg * 0.9
                    });
                }
            }

            // 雷射 (追蹤)
            if (player.weapons.laser > 0) {
                let count = Math.min(5, player.weapons.laser);
                for (let i = 0; i < count; i++) {
                    bullets.push({
                        x: aimY < 0 ? player.x + player.width / 2 - 2 + (i * 8) : (player.facing > 0 ? player.x + player.width : player.x - 15),
                        y: (aimY < 0 ? player.y - 15 : player.y + 18) + (i * 5),
                        vx: aimX * 14,
                        vy: aimY * 14,
                        width: 16,
                        height: 4,
                        type: 'laser',
                        dmg: baseDmg * 1.2,
                        homing: true,
                        homingRange: 200 + (player.weapons.laser * 20)
                    });
                }
            }
        }

        // === 技能選擇彈窗 ===
        function openSkillChoices(isInitial = false) {
            isPausedForSkill = true;
            initialPick = isInitial;
            skillOptionsContainer.innerHTML = '';
            
            modalTitle.textContent = isInitial ? "🎁 開局選擇初始天賦技能 (按 1, 2, 3)：" : "🎁 獲得補給箱！選擇強化技能 (按 1, 2, 3)：";
            
            const allSkills = [
                { 
                    id: 'scatter', 
                    name: `🔥 散彈強化 (Lv.${Math.min(8, player.weapons.scatter + 1)})`, 
                    desc: '多發扇形散射，清場首選', 
                    action: () => { if (player.weapons.scatter < 8) player.weapons.scatter++; }
                },
                { 
                    id: 'laser', 
                    name: `⚡ 雷射追蹤 (Lv.${Math.min(8, player.weapons.laser + 1)})`, 
                    desc: '自動尋敵高傷害雷射貫穿', 
                    action: () => { if (player.weapons.laser < 8) player.weapons.laser++; }
                },
                { 
                    id: 'shield', 
                    name: '🛡️ 能量護盾充能', 
                    desc: '護盾重置為滿層 3 點', 
                    action: () => { 
                        shieldCharges = 3;
                        shieldElement.textContent = `${shieldCharges}/3`;
                    }
                },
                {
                    id: 'heal',
                    name: `❤️ 醫療補血 (Lv.${player.weapons.heal + 1})`,
                    desc: '立即恢復 2 點生命值',
                    action: () => {
                        lives += 2;
                        livesElement.textContent = lives;
                    }
                }
            ];

            currentSkillChoices = [...allSkills].sort(() => Math.random() - 0.5).slice(0, 3);

            currentSkillChoices.forEach((skill, index) => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.innerHTML = `<h3>[${index + 1}] ${skill.name}</h3><p>${skill.desc}</p>`;
                card.onclick = () => selectSkillByIndex(index);
                skillOptionsContainer.appendChild(card);
            });
            skillModal.style.display = 'flex';
        }

        function selectSkillByIndex(index) {
            if (!isPausedForSkill || !currentSkillChoices[index]) return;
            currentSkillChoices[index].action();
            playSound('powerup');
            skillModal.style.display = 'none';
            isPausedForSkill = false;

            if (initialPick) startCountdown();
        }

        function startCountdown() {
            countdownTimer = 120; // 2秒倒數
        }

        // === 怪物生成邏輯 ===
        let enemySpawnTimer = 0;
        function handleSpawns() {
            let scoreThreshold = wave * 8000;
            if (score >= scoreThreshold && !boss) {
                let bossHp = Math.round(40 * Math.pow(1.8, wave - 1));
                boss = {
                    x: canvas.width - 100,
                    y: groundY - 100,
                    width: 75,
                    height: 95,
                    hp: bossHp,
                    maxHp: bossHp,
                    vy: 2.2 + (wave * 0.2),
                    shootTimer: 0,
                    hitFlash: 0
                };
                return;
            }

            if (boss) return;

            enemySpawnTimer++;
            let spawnInterval = Math.max(20, 42 - (wave * 3));
            if (enemySpawnTimer > spawnInterval && enemies.length < 8) {
                let isSky = Math.random() < 0.35; 
                let baseSpeed = 2.6 + (wave * 0.2);
                let colorType = 'green';
                let hp = 1;
                let speed = baseSpeed;

                if (!isSky) {
                    let randColor = Math.random();
                    if (randColor < 0.3) {
                        colorType = 'red';
                        speed = baseSpeed * 1.8; 
                    } else if (randColor < 0.6) {
                        colorType = 'yellow';
                        hp = 2 + Math.floor(wave / 2); 
                    }
                }

                enemies.push({
                    x: canvas.width,
                    y: isSky ? 25 : groundY - 38, 
                    width: 34,
                    height: 38,
                    vx: -speed,
                    isSky: isSky,
                    colorType: colorType,
                    hp: hp,
                    bombTimer: 0,
                    hitFlash: 0
                });
                enemySpawnTimer = 0;
            }
        }

        // === 受傷判定 ===
        function takeDamage() {
            if (invincibleTimer > 0) return;
            playSound('hit');
            if (shieldCharges > 0) {
                shieldCharges--;
                shieldElement.textContent = `${shieldCharges}/3`;
                invincibleTimer = 30; // 無敵幀保護
                return;
            }
            lives--;
            livesElement.textContent = lives;
            invincibleTimer = 45; // 玩家受傷無敵幀

            if (lives <= 0) {
                isGameOver = true;
                playSound('explode');
                openShopModal();
            }
        }

        // === 局外商店邏輯 ===
        function openShopModal() {
            document.getElementById('talHp').textContent = talents.hp;
            document.getElementById('talShield').textContent = talents.shield;
            document.getElementById('talDmg').textContent = talents.dmg;
            soulsElement.textContent = souls;
            shopModal.style.display = 'flex';
            saveGameData();
        }

        function buyTalent(type) {
            let costMap = { hp: 100, shield: 150, dmg: 200 };
            let cost = costMap[type];
            if (souls >= cost) {
                souls -= cost;
                talents[type]++;
                playSound('powerup');
                openShopModal();
            }
        }

        function restartGame() {
            shopModal.style.display = 'none';
            score = 0;
            wave = 1;
            lives = 10 + talents.hp;
            shieldCharges = talents.shield;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            shieldElement.textContent = `${shieldCharges}/3`;
            waveElement.textContent = `第 ${wave} 波`;
            
            bullets = [];
            enemyBullets = [];
            enemies = [];
            boss = null;
            powerUp = null;
            isGameOver = false;

            openSkillChoices(true);
        }

        // === 主更新邏輯 (Update) ===
        function update() {
            if (isGameOver || isPausedForSkill) return;

            if (countdownTimer > 0) {
                countdownTimer--;
                if (countdownTimer === 0) isGameStarted = true;
                return;
            }

            if (!isGameStarted) return;

            if (player.shootCooldown > 0) player.shootCooldown--;

            bgScrollX += 1.2;
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -100) c.x = canvas.width + 50;
            });

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 無敵冷卻
            if (invincibleTimer > 0) invincibleTimer--;
            if (invincibleCdTimer > 0) {
                invincibleCdTimer--;
                let sec = (invincibleCdTimer / 60).toFixed(1);
                invincibleCdElement.textContent = `${sec}秒`;
                invincibleCdElement.style.color = "#FF5252";
            } else {
                invincibleCdElement.textContent = "就緒";
                invincibleCdElement.style.color = "#00E5FF";
            }

            // 玩家左右移動
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                player.facing = -1;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                player.facing = 1;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;
            player.vy += gravity;
            player.y += player.vy;

            // 地面碰撞
            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isJumping = false;
                player.canDoubleJump = false;
            }

            // 跳躍平台碰撞
            platforms.forEach(plat => {
                if (
                    player.vy > 0 &&
                    player.x + player.width > plat.x &&
                    player.x < plat.x + plat.w &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height <= plat.y + 12
                ) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.isJumping = false;
                    player.canDoubleJump = false;
                }
            });

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            // 玩家動畫
            if (player.vx !== 0 && !player.isJumping) {
                player.animTimer++;
                if (player.animTimer > 5) {
                    player.runFrame = (player.runFrame + 1) % 12;
                    player.animTimer = 0;
                }
            } else {
                player.runFrame = 0;
            }

            // 玩家子彈移動與打擊碰撞
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (b.homing) {
                    let target = null;
                    let minDist = b.homingRange;
                    enemies.forEach(e => {
                        let dist = Math.hypot((e.x + e.width/2) - b.x, (e.y + e.height/2) - b.y);
                        if (dist < minDist) { minDist = dist; target = e; }
                    });
                    if (boss) {
                        let dist = Math.hypot((boss.x + boss.width/2) - b.x, (boss.y + boss.height/2) - b.y);
                        if (dist < minDist) target = boss;
                    }

                    if (target) {
                        let targetAngle = Math.atan2((target.y + target.height/2) - b.y, (target.x + target.width/2) - b.x);
                        let currentAngle = Math.atan2(b.vy, b.vx);
                        let angleDiff = targetAngle - currentAngle;
                        let speed = Math.hypot(b.vx, b.vy);
                        let newAngle = currentAngle + Math.max(-0.18, Math.min(0.18, angleDiff));
                        b.vx = Math.cos(newAngle) * speed;
                        b.vy = Math.sin(newAngle) * speed;
                    }
                }

                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // 敵方子彈移動與傷害
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].x += enemyBullets[i].vx;
                enemyBullets[i].y += enemyBullets[i].vy;

                if (
                    player.x < enemyBullets[i].x + enemyBullets[i].width &&
                    player.x + player.width > enemyBullets[i].x &&
                    player.y < enemyBullets[i].y + enemyBullets[i].height &&
                    player.y + player.height > enemyBullets[i].y
                ) {
                    enemyBullets.splice(i, 1);
                    takeDamage();
                } else if (enemyBullets[i].x < 0 || enemyBullets[i].x > canvas.width || enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                }
            }

            // 拾取寶箱
            if (powerUp) {
                if (
                    player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y
                ) {
                    powerUp = null;
                    openSkillChoices(false);
                }
            }

            // 小怪邏輯
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.x += e.vx;
                if (e.hitFlash > 0) e.hitFlash--;

                if (e.isSky) {
                    e.bombTimer++;
                    if (e.bombTimer > 85) {
                        enemyBullets.push({
                            x: e.x,
                            y: e.y + e.height,
                            vx: -1.5,
                            vy: 3.8,
                            width: 10,
                            height: 10
                        });
                        e.bombTimer = 0;
                    }
                }

                // 子彈擊中小怪
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b && e &&
                        b.x < e.x + e.width &&
                        b.x + b.width > e.x &&
                        b.y < e.y + e.height &&
                        b.y + b.height > e.y
                    ) {
                        bullets.splice(j, 1);
                        e.hp -= b.dmg;
                        e.hitFlash = 4;
                        addParticles(b.x, b.y, '#FFEB3B', 4);

                        if (e.hp <= 0) {
                            addParticles(e.x + e.width/2, e.y + e.height/2, '#FF5722', 10);
                            playSound('explode');
                            let deadX = e.x;
                            enemies.splice(i, 1);

                            score += 120;
                            souls += 3;
                            scoreElement.textContent = score;
                            soulsElement.textContent = souls;

                            if (!powerUp && Math.random() < 0.12) {
                                powerUp = { x: deadX, y: groundY - 26, width: 26, height: 26 };
                            }
                        }
                        break;
                    }
                }

                // 怪物撞擊玩家
                if (
                    e &&
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y
                ) {
                    enemies.splice(i, 1);
                    takeDamage();
                }

                if (e && e.x < -40) enemies.splice(i, 1);
            }

            // === BOSS 升級邏輯 (狂暴模式 + 彈幕) ===
            if (boss) {
                boss.y += boss.vy;
                if (boss.y <= 60 || boss.y >= groundY - boss.height) boss.vy *= -1;

                if (boss.hitFlash > 0) boss.hitFlash--;

                let isEnraged = boss.hp < (boss.maxHp / 2);
                let shootInterval = isEnraged ? Math.max(16, 32 - (wave * 2)) : Math.max(26, 52 - (wave * 2));

                boss.shootTimer++;
                if (boss.shootTimer > shootInterval) {
                    let angle = Math.atan2((player.y + player.height/2) - (boss.y + boss.height/2), player.x - boss.x);
                    
                    if (isEnraged) {
                        // 狂暴半血三向彈幕
                        [-0.25, 0, 0.25].forEach(offset => {
                            enemyBullets.push({
                                x: boss.x,
                                y: boss.y + boss.height / 2,
                                vx: Math.cos(angle + offset) * (5.2 + wave * 0.2),
                                vy: Math.sin(angle + offset) * (5.2 + wave * 0.2),
                                width: 12,
                                height: 12
                            });
                        });
                    } else {
                        enemyBullets.push({
                            x: boss.x,
                            y: boss.y + boss.height / 2,
                            vx: Math.cos(angle) * (4.5 + wave * 0.2),
                            vy: Math.sin(angle) * (4.5 + wave * 0.2),
                            width: 12,
                            height: 12
                        });
                    }
                    boss.shootTimer = 0;
                }

                // 子彈擊中 Boss
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b && boss &&
                        b.x < boss.x + boss.width &&
                        b.x + b.width > boss.x &&
                        b.y < boss.y + boss.height &&
                        b.y + b.height > boss.y
                    ) {
                        bullets.splice(j, 1);
                        boss.hp -= b.dmg;
                        boss.hitFlash = 4;
                        addParticles(b.x, b.y, '#FF0055', 5);

                        if (boss.hp <= 0) {
                            addParticles(boss.x + boss.width/2, boss.y + boss.height/2, '#FFD700', 25);
                            playSound('explode');
                            boss = null;
                            score += 2500;
                            souls += 50;
                            scoreElement.textContent = score;
                            soulsElement.textContent = souls;
                            wave++;
                            waveElement.textContent = `第 ${wave} 波`;
                            openSkillChoices(false);
                            break;
                        }
                    }
                }

                if (
                    boss &&
                    player.x < boss.x + boss.width &&
                    player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height &&
                    player.y + player.height > boss.y
                ) {
                    takeDamage();
                }
            }

            handleSpawns();
        }

        // === 繪製邏輯 (Draw) ===
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景天空
            ctx.fillStyle = '#16162d';
            ctx.fillRect(0, 0, canvas.width, groundY);

            // 雲朵
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size * 0.3, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.2, c.y - c.size * 0.1, c.size * 0.25, 0, Math.PI * 2);
                ctx.fill();
            });

            // 懸浮跳躍平台
            ctx.fillStyle = '#3a3a5e';
            ctx.strokeStyle = '#6c6ce6';
            ctx.lineWidth = 2;
            platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
            });

            // 地面
            ctx.fillStyle = '#223822';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(0, groundY + 8, canvas.width, canvas.height - groundY - 8);

            // 倒數文字
            if (countdownTimer > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`戰鬥準備... ${Math.ceil(countdownTimer / 60)}`, canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'start';
            }

            // 補給寶箱
            if (powerUp) {
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('🎁', powerUp.x + 3, powerUp.y + 20);
            }

            // 繪製打擊粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });

            // 玩家
            if (!isGameOver) {
                ctx.save();
                if (invincibleTimer > 0) {
                    ctx.shadowColor = '#00E5FF';
                    ctx.shadowBlur = 12;
                    if (Math.floor(invincibleTimer / 4) % 2 === 0) ctx.globalAlpha = 0.5;
                }

                let currentImg = player.isShooting ? shootSpriteImg : runSpriteImg;
                if (currentImg && currentImg.complete && currentImg.naturalWidth !== 0) {
                    ctx.save();
                    if (player.facing < 0) {
                        ctx.translate(player.x + player.width, player.y);
                        ctx.scale(-1, 1);
                        ctx.drawImage(currentImg, 0, 0, player.width, player.height);
                    } else {
                        ctx.drawImage(currentImg, player.x, player.y, player.width, player.height);
                    }
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#FF5722';
                    ctx.fillRect(player.x, player.y, player.width, player.height);
                }

                if (shieldCharges > 0) {
                    ctx.strokeStyle = '#00E5FF';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2 + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 玩家子彈
            bullets.forEach(b => {
                ctx.fillStyle = b.type === 'scatter' ? '#FFEB3B' : (b.type === 'laser' ? '#00E5FF' : '#FF5722');
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // 敵方子彈
            ctx.fillStyle = '#FF1744';
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x + eb.width/2, eb.y + eb.height/2, eb.width/2, 0, Math.PI * 2);
                ctx.fill();
            });

            // 小怪
            enemies.forEach(e => {
                ctx.save();
                if (e.hitFlash > 0) ctx.filter = 'brightness(2.5)';
                let monsterIdx = (wave - 1) % 10;
                let mImg = monsterImages[monsterIdx];
                if (mImg && mImg.complete && mImg.naturalWidth !== 0) {
                    ctx.drawImage(mImg, e.x, e.y, e.width, e.height);
                } else {
                    ctx.fillStyle = e.colorType === 'red' ? '#FF1744' : (e.colorType === 'yellow' ? '#FFEA00' : '#4CAF50');
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                }
                ctx.restore();
            });

            // Boss
            if (boss) {
                ctx.save();
                if (boss.hitFlash > 0) ctx.filter = 'brightness(3.0)';
                let bossIdx = (wave - 1) % 10;
                let bImg = bossImages[bossIdx];
                if (bImg && bImg.complete && bImg.naturalWidth !== 0) {
                    ctx.drawImage(bImg, boss.x, boss.y, boss.width, boss.height);
                } else {
                    ctx.fillStyle = '#D500F9';
                    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
                }
                ctx.restore();

                // Boss 血條
                ctx.fillStyle = '#333';
                ctx.fillRect(boss.x, boss.y - 14, boss.width, 8);
                let hpPercent = Math.max(0, boss.hp / boss.maxHp);
                ctx.fillStyle = hpPercent < 0.5 ? '#FF1744' : '#00E676';
                ctx.fillRect(boss.x, boss.y - 14, boss.width * hpPercent, 8);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 初始化局外天賦並啟動遊戲
        soulsElement.textContent = souls;
        lives = 10 + talents.hp;
        shieldCharges = talents.shield;
        livesElement.textContent = lives;
        shieldElement.textContent = `${shieldCharges}/3`;

        openSkillChoices(true);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>

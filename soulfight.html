<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魂斗羅：自訂圖片版</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.3rem;
            color: #ff4444;
            letter-spacing: 2px;
        }

        #scoreboard {
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: flex;
            gap: 12px;
        }

        .game-container {
            position: relative;
        }

        canvas {
            border: 3px solid #ff4444;
            background-color: #1a1a2e;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
            max-width: 95vw;
            width: 650px;
            height: 360px;
            display: block;
        }

        #skillModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #skillModal h2 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 1.4rem;
            text-align: center;
        }

        .skill-options {
            display: flex;
            gap: 15px;
        }

        .skill-card {
            background: #222;
            border: 2px solid #FFD700;
            padding: 15px;
            width: 150px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .skill-card:hover {
            background: #444;
            transform: scale(1.05);
        }

        .skill-card h3 {
            margin: 0 0 8px 0;
            color: #FFEB3B;
            font-size: 0.95rem;
        }

        .skill-card p {
            margin: 0;
            font-size: 0.75rem;
            color: #ccc;
        }

        .key-hints {
            margin-top: 5px;
            background-color: #222;
            border: 1px solid #444;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            max-width: 650px;
        }

        .key-hints span {
            color: #FFEB3B;
            font-weight: bold;
        }

        .controls {
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }

        .ctrl-group {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 45px);
            gap: 4px;
        }

        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            font-size: 1.1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
        }

        .btn:active {
            background-color: #ff4444;
            border-color: #ff8888;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .btn-jump { background-color: #2a4b7c; width: 60px; height: 50px; font-size: 0.95rem; }
        .btn-fire { background-color: #7c2a2a; width: 60px; height: 60px; font-size: 0.9rem; border-radius: 50%; }
        .btn-invincible { background-color: #4A148C; width: 60px; height: 50px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <h1>👻 魂斗羅：多重 Boss 與怪物版</h1>
    
    <div id="scoreboard">
        <div>分數: <span id="score">0</span></div>
        <div>生命: <span id="lives">10</span></div>
        <div>護盾: <span id="shield" style="color: #00E5FF;">0/3</span></div>
        <div>關卡: <span id="wave" style="color: #4CAF50;">第 1 波</span></div>
        <div>武器: <span id="weapon" style="color: #FFEB3B;">普彈 Lv.1</span></div>
        <div>無敵CD: <span id="invincibleCd" style="color: #00E5FF;">就緒 (C)</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="650" height="360"></canvas>
        
        <div id="skillModal">
            <h2 id="modalTitle">🎁 獲得補給箱！請選擇技能 (按 1, 2, 3)：</h2>
            <div class="skill-options" id="skillOptionsContainer"></div>
        </div>
    </div>

    <div class="key-hints">
        💡 <b>操作說明：</b> 移動 <span>⬅️ ➡️</span> | 瞄準 <span>⬆️</span> | 二段跳 <span>X / 空白</span> | 點擊射擊 <span>Z</span> | 無敵 <span>C</span> | 技能 <span>1/2/3</span>
    </div>

    <div class="controls">
        <div class="ctrl-group">
            <button class="btn btn-up" id="btnUp">⬆️</button>
            <button class="btn btn-left" id="btnLeft">⬅️</button>
            <button class="btn btn-right" id="btnRight">➡️</button>
        </div>
        <div class="action-group">
            <button class="btn btn-jump" id="btnJump">跳躍(X)</button>
            <button class="btn btn-fire" id="btnFire">🔥 射擊(Z)</button>
            <button class="btn btn-invincible" id="btnInvinc">🛡️ 無敵(C)</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🖼️ 圖片路徑設定區 (在下方修改你的圖片檔名)
        // ==========================================
        const IMAGE_PATHS = {
            playerRun: 'player_run.png',
            playerShoot: 'player_shoot.png',
            bullet: 'SHOOT1.PNG',
            // 10 種小怪檔名
            monsters: [
                'MONSTER1.PNG', 'MONSTER2.PNG', 'MONSTER3.PNG', 'MONSTER4.PNG', 'MONSTER5.PNG',
                'MONSTER6.PNG', 'MONSTER7.PNG', 'MONSTER8.PNG', 'MONSTER9.PNG', 'MONSTER10.PNG'
            ],
            // 10 種 BOSS 檔名
            bosses: [
                'BOSS1.png', 'BOSS2.png', 'BOSS3.png', 'BOSS4.png', 'BOSS5.png',
                'BOSS6.png', 'BOSS7.png', 'BOSS8.png', 'BOSS9.png', 'BOSS10.png'
            ]
        };

        // 自動動態載入圖片
        function loadImage(src) {
            const img = new Image();
            img.src = src;
            return img;
        }

        const runSpriteImg = loadImage(IMAGE_PATHS.playerRun);
        const shootSpriteImg = loadImage(IMAGE_PATHS.playerShoot);
        const shootBulletImg = loadImage(IMAGE_PATHS.bullet);
        const monsterImages = IMAGE_PATHS.monsters.map(src => loadImage(src));
        const bossImages = IMAGE_PATHS.bosses.map(src => loadImage(src));

        // ==========================================
        // 🎮 遊戲核心邏輯
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const shieldElement = document.getElementById('shield');
        const waveElement = document.getElementById('wave');
        const weaponElement = document.getElementById('weapon');
        const invincibleCdElement = document.getElementById('invincibleCd');
        const skillModal = document.getElementById('skillModal');
        const modalTitle = document.getElementById('modalTitle');
        const skillOptionsContainer = document.getElementById('skillOptionsContainer');

        let score = 0;
        let lives = 10;
        let shieldCharges = 0;
        let wave = 1;
        let isGameOver = false;
        let isPausedForSkill = false;
        let isGameStarted = false; 
        let countdownTimer = 0; 
        let currentSkillChoices = [];
        let initialPick = true;

        let bgScrollX = 0;
        let clouds = [
            { x: 50, y: 40, speed: 0.2, size: 50 },
            { x: 280, y: 70, speed: 0.15, size: 70 },
            { x: 520, y: 30, speed: 0.25, size: 60 }
        ];

        let invincibleTimer = 0;
        let invincibleCdTimer = 0;
        const invincibleDuration = 180;
        const invincibleCdMax = 1200;

        let player = {
            x: 50,
            y: 240,
            width: 52,
            height: 52,
            vx: 0,
            vy: 0,
            speed: 4,
            jumpPower: -11.5,
            isJumping: false,
            canDoubleJump: false,
            isShooting: false,
            shootAnimTimer: 0,
            facing: 1,
            weapons: {
                normal: 1,  
                scatter: 0, 
                laser: 0,
                heal: 0     
            },
            shootCooldown: 0,
            animTimer: 0,
            runFrame: 0,
            shootFrame: 0
        };

        let gravity = 0.55;
        let groundY = 290;

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let powerUp = null;
        let boss = null;

        let keys = {};
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            keys[e.code] = true;

            if (isPausedForSkill) {
                if (e.code === 'Digit1' || e.code === 'Numpad1') selectSkillByIndex(0);
                if (e.code === 'Digit2' || e.code === 'Numpad2') selectSkillByIndex(1);
                if (e.code === 'Digit3' || e.code === 'Numpad3') selectSkillByIndex(2);
                e.preventDefault();
                return;
            }

            if (!isGameStarted) return;

            if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX' || e.code === 'ArrowUp') {
                if (e.code === 'Space' || e.code === 'KeyK' || e.code === 'KeyX') {
                    triggerJump();
                    e.preventDefault();
                }
            }
            if (e.code === 'KeyZ') {
                fireBullet();
                e.preventDefault();
            }
            if (e.code === 'KeyC') {
                triggerInvincible();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function triggerJump() {
            if (isGameOver || isPausedForSkill || !isGameStarted) return;

            if (!player.isJumping) {
                player.vy = player.jumpPower;
                player.isJumping = true;
                player.canDoubleJump = true;
            } else if (player.canDoubleJump) {
                player.vy = player.jumpPower * 0.9;
                player.canDoubleJump = false;
            }
        }

        function triggerInvincible() {
            if (isGameOver || isPausedForSkill || !isGameStarted) return;
            if (invincibleCdTimer <= 0) {
                invincibleTimer = invincibleDuration;
                invincibleCdTimer = invincibleCdMax;
            }
        }

        function bindButton(id, actionDown, actionUp) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); actionDown(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); if(actionUp) actionUp(); });
            el.addEventListener('mousedown', actionDown);
            if(actionUp) el.addEventListener('mouseup', actionUp);
        }

        bindButton('btnUp', () => keys['ArrowUp'] = true, () => keys['ArrowUp'] = false);
        bindButton('btnLeft', () => keys['ArrowLeft'] = true, () => keys['ArrowLeft'] = false);
        bindButton('btnRight', () => keys['ArrowRight'] = true, () => keys['ArrowRight'] = false);
        bindButton('btnJump', () => triggerJump());
        bindButton('btnFire', () => fireBullet());
        bindButton('btnInvinc', () => triggerInvincible());

        function fireBullet() {
            if (isGameOver || isPausedForSkill || !isGameStarted) return;
            if (player.shootCooldown > 0) return;

            player.shootCooldown = 6;
            player.isShooting = true;
            player.shootFrame = 0;
            player.shootAnimTimer = 0;

            let aimX = player.facing;
            let aimY = 0;

            if (keys['ArrowUp'] || keys['KeyW']) {
                aimY = -1;
                aimX = 0;
            }

            if (player.weapons.normal > 0) {
                let count = player.weapons.normal;
                for (let i = 0; i < count; i++) {
                    bullets.push({
                        x: aimY < 0 ? player.x + player.width / 2 - 3 + (i * 6) : (player.facing > 0 ? player.x + player.width : player.x - 12),
                        y: (aimY < 0 ? player.y - 10 : player.y + 20) + (i * 5),
                        vx: aimX * 10,
                        vy: aimY * 10,
                        width: 12,
                        height: 8,
                        type: 'normal'
                    });
                }
            }

            if (player.weapons.scatter > 0) {
                let totalBullets = player.weapons.scatter;
                let spreadStep = 0.5;
                for (let i = 0; i < totalBullets; i++) {
                    let spreadFactor = (i - (totalBullets - 1) / 2) * spreadStep;
                    bullets.push({
                        x: player.facing > 0 ? player.x + player.width : player.x - 12,
                        y: player.y + 20,
                        vx: player.facing * 9,
                        vy: spreadFactor,
                        width: 12,
                        height: 8,
                        type: 'scatter'
                    });
                }
            }

            if (player.weapons.laser > 0) {
                let count = Math.min(6, player.weapons.laser);
                for (let i = 0; i < count; i++) {
                    bullets.push({
                        x: aimY < 0 ? player.x + player.width / 2 - 2 + (i * 8) : (player.facing > 0 ? player.x + player.width : player.x - 15),
                        y: (aimY < 0 ? player.y - 15 : player.y + 20) + (i * 6),
                        vx: aimX * 15,
                        vy: aimY * 15,
                        width: 18,
                        height: 4,
                        type: 'laser',
                        homing: true,
                        homingRange: 180 + (player.weapons.laser * 15)
                    });
                }
            }
        }

        function updateWeaponDisplay() {
            let activeList = [];
            if (player.weapons.normal > 0) activeList.push(`普彈 Lv.${player.weapons.normal}`);
            if (player.weapons.scatter > 0) activeList.push(`散彈 Lv.${player.weapons.scatter}`);
            if (player.weapons.laser > 0) activeList.push(`雷射 Lv.${player.weapons.laser}`);
            if (player.weapons.heal > 0) {
                let currentChance = (1 + (player.weapons.heal - 1) * 0.5).toFixed(1);
                activeList.push(`醫療 Lv.${player.weapons.heal} (${currentChance}%)`);
            }
            weaponElement.textContent = activeList.join(" | ");
        }

        function openSkillChoices(isInitial = false) {
            isPausedForSkill = true;
            initialPick = isInitial;
            skillOptionsContainer.innerHTML = '';
            
            modalTitle.textContent = isInitial 
                ? "🎁 遊戲即將開始！請選擇您的開局初始技能 (按 1, 2, 3)：" 
                : "🎁 獲得補給箱！請選擇技能 (按 1, 2, 3)：";
            
            let currentHealChance = 1 + (player.weapons.heal * 0.5);

            const allSkills = [
                { 
                    id: 'scatter', 
                    name: `🔥 散彈強化 (Lv.${Math.min(10, player.weapons.scatter + 1)})`, 
                    desc: '黃色子彈數量 +1（最高 10 階）', 
                    action: () => { 
                        if (player.weapons.scatter < 10) player.weapons.scatter++;
                        updateWeaponDisplay();
                    }
                },
                { 
                    id: 'laser', 
                    name: `⚡ 雷射強化 (Lv.${Math.min(10, player.weapons.laser + 1)})`, 
                    desc: '雷射數量增加與智慧追蹤（最高 10 階）', 
                    action: () => { 
                        if (player.weapons.laser < 10) player.weapons.laser++;
                        updateWeaponDisplay();
                    }
                },
                { 
                    id: 'shield', 
                    name: '🛡️ 能量護盾', 
                    desc: '充能防護罩（可承受 3 發子彈或撞擊）', 
                    action: () => { 
                        shieldCharges = 3;
                        shieldElement.textContent = `${shieldCharges}/3`;
                    }
                },
                {
                    id: 'heal',
                    name: `❤️ 醫療補給 (Lv.${player.weapons.heal + 1})`,
                    desc: `觸發機率升至 ${currentHealChance.toFixed(1)}% 獲得 +1 血量`,
                    action: () => {
                        player.weapons.heal++;
                        let chance = 1 + (player.weapons.heal - 1) * 0.5;
                        let roll = Math.random() * 100;
                        if (roll < chance) {
                            lives += 1; 
                        }
                        lives += 1; 
                        livesElement.textContent = lives;
                        updateWeaponDisplay();
                    }
                }
            ];

            currentSkillChoices = [...allSkills].sort(() => Math.random() - 0.5).slice(0, 3);

            currentSkillChoices.forEach((skill, index) => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.innerHTML = `<h3>[${index + 1}] ${skill.name}</h3><p>${skill.desc}</p>`;
                card.onclick = () => selectSkillByIndex(index);
                skillOptionsContainer.appendChild(card);
            });
            skillModal.style.display = 'flex';
        }

        function selectSkillByIndex(index) {
            if (!isPausedForSkill || !currentSkillChoices[index]) return;
            currentSkillChoices[index].action();
            skillModal.style.display = 'none';
            isPausedForSkill = false;

            if (initialPick) {
                startCountdown();
            }
        }

        function startCountdown() {
            countdownTimer = 180; 
        }

        let enemySpawnTimer = 0;
        function handleSpawns() {
            let scoreThreshold = wave * 10000;
            if (score >= scoreThreshold && !boss) {
                let bossHp = Math.round(35 * Math.pow(2, wave - 1));
                boss = {
                    x: canvas.width - 90,
                    y: groundY - 90,
                    width: 70,
                    height: 90,
                    hp: bossHp,
                    maxHp: bossHp,
                    vy: 2.0 + (wave * 0.2),
                    shootTimer: 0
                };
                return;
            }

            if (boss) return;

            enemySpawnTimer++;
            let spawnInterval = Math.max(20, 45 - (wave * 3));
            if (enemySpawnTimer > spawnInterval && enemies.length < 8) {
                let isSky = Math.random() < 0.33; 
                let baseSpeed = 2.5 + (wave * 0.2);
                let colorType = 'green';
                let hp = 1;
                let speed = baseSpeed;

                if (!isSky) {
                    let randColor = Math.random();
                    if (randColor < 0.33) {
                        colorType = 'red';
                        speed = baseSpeed * 2.0; 
                    } else if (randColor < 0.66) {
                        colorType = 'yellow';
                        hp = 2; 
                    } else {
                        colorType = 'green';
                    }
                }

                enemies.push({
                    x: canvas.width,
                    y: isSky ? 15 : groundY - 38, 
                    width: 32,
                    height: 38,
                    vx: -speed,
                    isSky: isSky,
                    colorType: colorType,
                    hp: hp,
                    bombTimer: 0
                });
                enemySpawnTimer = 0;
            }
        }

        function takeDamage() {
            if (invincibleTimer > 0) return;
            if (shieldCharges > 0) {
                shieldCharges--;
                shieldElement.textContent = `${shieldCharges}/3`;
                return;
            }
            lives--;
            livesElement.textContent = lives;
            if (lives <= 0) isGameOver = true;
        }

        function update() {
            if (isGameOver || isPausedForSkill) return;

            if (countdownTimer > 0) {
                countdownTimer--;
                if (countdownTimer === 0) {
                    isGameStarted = true;
                }
                return;
            }

            if (!isGameStarted) return;

            if (player.shootCooldown > 0) player.shootCooldown--;

            bgScrollX += 1.2;
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -100) c.x = canvas.width + 50;
            });

            if (invincibleTimer > 0) invincibleTimer--;
            if (invincibleCdTimer > 0) {
                invincibleCdTimer--;
                let sec = (invincibleCdTimer / 60).toFixed(1);
                invincibleCdElement.textContent = `${sec}秒`;
                invincibleCdElement.style.color = "#FF5252";
            } else {
                invincibleCdElement.textContent = "就緒 (C)";
                invincibleCdElement.style.color = "#00E5FF";
            }

            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                player.facing = -1;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                player.facing = 1;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;
            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isJumping = false;
                player.canDoubleJump = false;
            }

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            if (player.vx !== 0 && !player.isJumping) {
                player.animTimer++;
                if (player.animTimer > 5) {
                    player.runFrame = (player.runFrame + 1) % 12;
                    player.animTimer = 0;
                }
            } else {
                player.runFrame = 0;
            }

            if (player.isShooting) {
                player.shootAnimTimer++;
                if (player.shootAnimTimer > 4) {
                    player.shootFrame++;
                    player.shootAnimTimer = 0;
                    if (player.shootFrame >= 8) {
                        player.isShooting = false;
                        player.shootFrame = 0;
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                if (b.homing) {
                    let target = null;
                    let minDist = b.homingRange;
                    enemies.forEach(e => {
                        let dist = Math.hypot((e.x + e.width/2) - b.x, (e.y + e.height/2) - b.y);
                        if (dist < minDist) {
                            minDist = dist;
                            target = e;
                        }
                    });
                    if (boss) {
                        let dist = Math.hypot((boss.x + boss.width/2) - b.x, (boss.y + boss.height/2) - b.y);
                        if (dist < minDist) {
                            target = boss;
                        }
                    }

                    if (target) {
                        let targetAngle = Math.atan2((target.y + target.height/2) - b.y, (target.x + target.width/2) - b.x);
                        let currentAngle = Math.atan2(b.vy, b.vx);
                        let angleDiff = targetAngle - currentAngle;
                        let speed = Math.hypot(b.vx, b.vy);
                        let newAngle = currentAngle + Math.max(-0.15, Math.min(0.15, angleDiff));
                        b.vx = Math.cos(newAngle) * speed;
                        b.vy = Math.sin(newAngle) * speed;
                    }
                }

                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].x += enemyBullets[i].vx;
                enemyBullets[i].y += enemyBullets[i].vy;

                if (
                    player.x < enemyBullets[i].x + enemyBullets[i].width &&
                    player.x + player.width > enemyBullets[i].x &&
                    player.y < enemyBullets[i].y + enemyBullets[i].height &&
                    player.y + player.height > enemyBullets[i].y
                ) {
                    enemyBullets.splice(i, 1);
                    takeDamage();
                } else if (enemyBullets[i].x < 0 || enemyBullets[i].x > canvas.width || enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                }
            }

            if (powerUp) {
                if (
                    player.x < powerUp.x + powerUp.width &&
                    player.x + player.width > powerUp.x &&
                    player.y < powerUp.y + powerUp.height &&
                    player.y + player.height > powerUp.y
                ) {
                    powerUp = null;
                    openSkillChoices(false);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].x += enemies[i].vx;

                if (enemies[i].isSky) {
                    enemies[i].bombTimer++;
                    if (enemies[i].bombTimer > 90) {
                        enemyBullets.push({
                            x: enemies[i].x,
                            y: enemies[i].y + enemies[i].height,
                            vx: -1.5,
                            vy: 3.5,
                            width: player.width * 0.9,
                            height: player.height * 0.9
                        });
                        enemies[i].bombTimer = 0;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] && enemies[i] &&
                        bullets[j].x < enemies[i].x + enemies[i].width &&
                        bullets[j].x + bullets[j].width > enemies[i].x &&
                        bullets[j].y < enemies[i].y + enemies[i].height &&
                        bullets[j].y + bullets[j].height > enemies[i].y
                    ) {
                        bullets.splice(j, 1); 
                        enemies[i].hp--; 

                        if (enemies[i].hp <= 0) {
                            let deadX = enemies[i].x;
                            enemies.splice(i, 1);

                            score += 100;
                            scoreElement.textContent = score;

                            if (!powerUp && Math.random() < 0.10) {
                                powerUp = {
                                    x: deadX,
                                    y: groundY - 26, 
                                    width: 26,
                                    height: 26
                                };
                            }
                        }
                        break;
                    }
                }

                if (
                    enemies[i] &&
                    player.x < enemies[i].x + enemies[i].width &&
                    player.x + player.width > enemies[i].x &&
                    player.y < enemies[i].y + enemies[i].height &&
                    player.y + player.height > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    takeDamage();
                }

                if (enemies[i] && enemies[i].x < -30) {
                    enemies.splice(i, 1);
                }
            }

            if (boss) {
                boss.y += boss.vy;
                if (boss.y <= 80 || boss.y >= groundY - boss.height) {
                    boss.vy *= -1;
                }

                boss.shootTimer++;
                let shootInterval = Math.max(25, 50 - (wave * 3));
                if (boss.shootTimer > shootInterval) {
                    let angle = Math.atan2((player.y + player.height/2) - (boss.y + boss.height/2), player.x - boss.x);
                    enemyBullets.push({
                        x: boss.x,
                        y: boss.y + boss.height / 2,
                        vx: Math.cos(angle) * (4.5 + wave * 0.2),
                        vy: Math.sin(angle) * (4.5 + wave * 0.2),
                        width: 12,
                        height: 12
                    });
                    boss.shootTimer = 0;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (
                        bullets[j] &&
                        bullets[j].x < boss.x + boss.width &&
                        bullets[j].x + bullets[j].width > boss.x &&
                        bullets[j].y < boss.y + boss.height &&
                        bullets[j].y + bullets[j].height > boss.y
                    ) {
                        bullets.splice(j, 1);
                        boss.hp--;

                        if (boss.hp <= 0) {
                            score += 5000;
                            scoreElement.textContent = score;
                            boss = null;
                            wave++;
                            waveElement.textContent = `第 ${wave} 波`;
                            openSkillChoices(false);
                            break;
                        }
                    }
                }

                if (
                    boss &&
                    player.x < boss.x + boss.width &&
                    player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height &&
                    player.y + player.height > boss.y
                ) {
                    takeDamage();
                }
            }

            handleSpawns();
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size * 0.4, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.25, c.y - c.size * 0.15, c.size * 0.3, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.5, c.y, c.size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, groundY, canvas.width, 6);

            if (invincibleTimer > 0) {
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width * 0.7, 0, Math.PI * 2);
                ctx.stroke();
            }

            if (shieldCharges > 0) {
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 繪製玩家
            let pImg = player.isShooting ? shootSpriteImg : runSpriteImg;
            if (pImg.complete && pImg.naturalWidth !== 0) {
                ctx.save();
                if (player.facing < 0) {
                    ctx.scale(-1, 1);
                    ctx.drawImage(pImg, -player.x - player.width, player.y, player.width, player.height);
                } else {
                    ctx.drawImage(pImg, player.x, player.y, player.width, player.height);
                }
                ctx.restore();
            } else {
                ctx.fillStyle = '#00E5FF';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // 繪製玩家子彈
            bullets.forEach(b => {
                if (shootBulletImg.complete && shootBulletImg.naturalWidth !== 0) {
                    ctx.drawImage(shootBulletImg, b.x, b.y, b.width, b.height);
                } else {
                    ctx.fillStyle = b.type === 'scatter' ? '#FFD700' : (b.type === 'laser' ? '#00E5FF' : '#FF5722');
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                }
            });

            // 繪製敵方子彈
            enemyBullets.forEach(eb => {
                ctx.fillStyle = '#FF1744';
                ctx.beginPath();
                ctx.arc(eb.x + eb.width/2, eb.y + eb.height/2, eb.width/2, 0, Math.PI * 2);
                ctx.fill();
            });

            // 繪製怪物
            enemies.forEach(e => {
                let mImgIdx = (wave - 1) % 10;
                let mImg = monsterImages[mImgIdx];
                if (mImg && mImg.complete && mImg.naturalWidth !== 0) {
                    ctx.drawImage(mImg, e.x, e.y, e.width, e.height);
                } else {
                    ctx.fillStyle = e.colorType === 'red' ? '#FF1744' : (e.colorType === 'yellow' ? '#FFD700' : '#4CAF50');
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                }
            });

            // 繪製寶箱
            if (powerUp) {
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                ctx.strokeStyle = '#FFF';
                ctx.strokeRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
            }

            // 繪製 BOSS
            if (boss) {
                let bImgIdx = (wave - 1) % 10;
                let bImg = bossImages[bImgIdx];
                if (bImg && bImg.complete && bImg.naturalWidth !== 0) {
                    ctx.drawImage(bImg, boss.x, boss.y, boss.width, boss.height);
                } else {
                    ctx.fillStyle = '#D500F9';
                    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
                }

                // BOSS 血條
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(boss.x, boss.y - 12, boss.width, 8);
                ctx.fillStyle = '#FF1744';
                ctx.fillRect(boss.x, boss.y - 12, (boss.hp / boss.maxHp) * boss.width, 8);
            }

            // 倒數計時
            if (countdownTimer > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 48px sans-serif';
                ctx.textAlign = 'center';
                let sec = Math.ceil(countdownTimer / 60);
                ctx.fillText(`準備開始: ${sec}`, canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            // 遊戲結束
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FF1744';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#FFF';
                ctx.font = '18px sans-serif';
                ctx.fillText(`最終分數: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
                ctx.fillText('請重新整理網頁以再次挑戰', canvas.width / 2, canvas.height / 2 + 55);
                ctx.textAlign = 'left';
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        openSkillChoices(true);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
